    --bg: #121A1D; --surface: #1A2428; --surface-2: #22303A; --surface-3: #2C3B45;
    --ink: #E4EBED; --muted: #9AAAB1; --line: #2C3A40; --line-strong: #3E4F57;
    --accent: #8FB3E6; --accent-ink: #0F1A24; --accent-soft: #223244;
    --iv: #9AA6F2; --dv: #E58BB1; --med: #E5B25C; --umum: #9AAAB1;
    --iv-bg: #262C4F; --dv-bg: #45253A; --med-bg: #44331A; --umum-bg: #2A353B;
    --hijau: #5FC98F; --kuning: #E8C24A; --merah: #F07B70;
    --hijau-bg: #17322A; --kuning-bg: #3A3316; --merah-bg: #3D1F1C;
    --code-bg: #1F2B30; --shadow: 0 6px 24px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121A1D; --surface: #1A2428; --surface-2: #22303A; --surface-3: #2C3B45;
  --ink: #E4EBED; --muted: #9AAAB1; --line: #2C3A40; --line-strong: #3E4F57;
  --accent: #8FB3E6; --accent-ink: #0F1A24; --accent-soft: #223244;
  --iv: #9AA6F2; --dv: #E58BB1; --med: #E5B25C; --umum: #9AAAB1;
  --iv-bg: #262C4F; --dv-bg: #45253A; --med-bg: #44331A; --umum-bg: #2A353B;
  --hijau: #5FC98F; --kuning: #E8C24A; --merah: #F07B70;
  --hijau-bg: #17322A; --kuning-bg: #3A3316; --merah-bg: #3D1F1C;
  --code-bg: #1F2B30; --shadow: 0 6px 24px rgba(0,0,0,.4);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; overscroll-behavior-y: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; font-family: var(--serif); font-weight: 600; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 24px; } h2 { font-size: 20px; } h3 { font-family: var(--sans); font-size: 15px; font-weight: 600; }
p { margin: 0 0 10px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.hidden, [hidden] { display: none !important; }

/* ---------- Shell ---------- */
.shell { display: grid; grid-template-columns: var(--nav-w) 1fr; grid-template-rows: var(--topbar-h) 1fr; min-height: 100vh; min-height: 100dvh; }
.topbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-weight: 600; font-size: 20px; letter-spacing: -0.01em; }
.brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: var(--serif); font-size: 15px; }
.topbar .today { color: var(--muted); font-size: 13.5px; }
.topbar .spacer { flex: 1; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); padding: 4px 10px; border-radius: 999px; background: var(--surface-2); white-space: nowrap; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync.ok .dot { background: var(--hijau); } .sync.pending .dot { background: var(--kuning); } .sync.off .dot { background: var(--merah); }
.nav { background: var(--surface); border-right: 1px solid var(--line); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; position: sticky; top: var(--topbar-h); height: calc(100vh - var(--topbar-h)); height: calc(100dvh - var(--topbar-h)); overflow: auto; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; text-decoration: none; color: var(--ink); font-weight: 500; font-size: 14px; }
.nav a:hover { background: var(--surface-2); }
.nav a.active { background: var(--accent-soft); color: var(--accent); }
.nav a .ic { width: 20px; text-align: center; font-size: 15px; opacity: .85; }
.nav .grow { flex: 1; }
.nav .navfoot { padding: 10px 12px; font-size: 12px; color: var(--muted); }
.main { padding: 20px 24px 96px; min-width: 0; }
.tabbar { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .nav { display: none; }
  .main { padding: 14px 14px 110px; }
  .topbar .today { display: none; }
  #btnWidget { display: none; }
  .vrow { grid-template-columns: 84px 1fr auto; }
  .tabbar { display: flex; position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); z-index: 30; padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
  .tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: var(--muted); font-size: 11px; padding: 4px 0; border-radius: 8px; }
  .tabbar a .ic { font-size: 18px; }
  .tabbar a.active { color: var(--accent); }
}

/* ---------- Components ---------- */
.pagehead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 10px; margin-bottom: 16px; }
.pagehead .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500; font-size: 14px; line-height: 1.2; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--merah); border-color: var(--merah); background: transparent; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: default; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { padding: 6px 12px; border: 0; background: var(--surface); font-size: 13.5px; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.active { background: var(--accent); color: var(--accent-ink); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.card h3 { margin-bottom: 8px; }
.grid { display: grid; gap: 14px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; line-height: 1; padding: 4px 8px; border-radius: 999px; white-space: nowrap; }
.chip.IV { background: var(--iv-bg); color: var(--iv); } .chip.DV { background: var(--dv-bg); color: var(--dv); }
.chip.MED { background: var(--med-bg); color: var(--med); } .chip.UMUM { background: var(--umum-bg); color: var(--umum); }
.chip.hijau { background: var(--hijau-bg); color: var(--hijau); } .chip.kuning { background: var(--kuning-bg); color: var(--kuning); } .chip.merah { background: var(--merah-bg); color: var(--merah); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
.dot.IV { background: var(--iv); } .dot.DV { background: var(--dv); } .dot.MED { background: var(--med); } .dot.UMUM { background: var(--umum); }
.dot.hijau { background: var(--hijau); } .dot.kuning { background: var(--kuning); } .dot.merah { background: var(--merah); }
.bar { height: 8px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: var(--accent); }
.bar.hijau > i { background: var(--hijau); } .bar.kuning > i { background: var(--kuning); } .bar.merah > i { background: var(--merah); }

.tasklist { display: flex; flex-direction: column; gap: 8px; }
.task { display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 12px 0; overflow: hidden; }
.task .stripe { align-self: stretch; border-radius: 0 3px 3px 0; }
.task .stripe.IV { background: var(--iv); } .task .stripe.DV { background: var(--dv); } .task .stripe.MED { background: var(--med); } .task .stripe.UMUM { background: var(--umum); }
.task .title { font-weight: 600; }
.task .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 4px; font-size: 12.5px; color: var(--muted); align-items: center; }
.task .right { display: flex; flex-direction: column; align-items: end; gap: 6px; }
.task .pct { font-family: var(--mono); font-size: 13px; }
.task.done .title { text-decoration: line-through; color: var(--muted); }
.days { font-family: var(--mono); font-size: 12px; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); }
.days.late { background: var(--merah-bg); color: var(--merah); } .days.soon { background: var(--kuning-bg); color: var(--kuning); }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); }
.tile .n { font-family: var(--serif); font-size: 30px; line-height: 1; font-weight: 600; }
.tile .l { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.tile.hijau { border-color: var(--hijau); background: var(--hijau-bg); } .tile.hijau .n { color: var(--hijau); }
.tile.kuning { border-color: var(--kuning); background: var(--kuning-bg); } .tile.kuning .n { color: var(--kuning); }
.tile.merah { border-color: var(--merah); background: var(--merah-bg); } .tile.merah .n { color: var(--merah); }
.vrow { display: grid; grid-template-columns: 110px 1fr 48px; gap: 10px; align-items: center; font-size: 13.5px; padding: 6px 0; }
.vrow .nm { display: flex; align-items: center; gap: 6px; }

/* forms */
.form { display: grid; gap: 12px; }
.field { display: grid; gap: 5px; }
.field label { font-size: 12.5px; font-weight: 600; color: var(--muted); letter-spacing: .01em; }
.field input, .field select, .field textarea { padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: 8px; background: var(--surface); width: 100%; }
.field textarea { min-height: 84px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .row3 { grid-template-columns: 1fr; } .row2 { grid-template-columns: 1fr; } .tiles { grid-template-columns: repeat(3, 1fr); } }
.radios { display: flex; flex-wrap: wrap; gap: 8px; }
.radios label { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line-strong); border-radius: 8px; cursor: pointer; font-size: 13.5px; }
.radios input { accent-color: var(--accent); }
.range { display: grid; grid-template-columns: 1fr 64px; gap: 10px; align-items: center; }
.range input[type=range] { width: 100%; accent-color: var(--accent); }
.pctbox { font-family: var(--mono); text-align: center; padding: 6px; border: 1px solid var(--line-strong); border-radius: 8px; }
.varpick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.varpick label { display: flex; align-items: center; gap: 8px; padding: 9px 10px; border: 1px solid var(--line-strong); border-radius: 8px; cursor: pointer; font-size: 13px; }
.varpick label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.hint { font-size: 12.5px; color: var(--muted); }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(10,20,25,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { width: min(640px, 100%); max-height: 92vh; max-height: 92dvh; overflow: auto; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); padding: 20px; }
.modal header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.modal footer { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.modal footer .r { display: flex; gap: 8px; margin-left: auto; }

/* banners */
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 14px; }
.banner.info { background: var(--accent-soft); color: var(--ink); }
.banner.warn { background: var(--kuning-bg); color: var(--ink); border: 1px solid var(--kuning); }
.banner.alarm { background: var(--merah-bg); color: var(--ink); border: 1px solid var(--merah); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(200,55,45,.0);} 50% { box-shadow: 0 0 0 6px rgba(200,55,45,.18);} }
@media (prefers-reduced-motion: reduce) { .banner.alarm { animation: none; } }
.banner .grow { flex: 1; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 13.5px; z-index: 60; box-shadow: var(--shadow); }

/* calendar */
.cal-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-grid .dow { font-size: 11.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 4px 6px; }
.cal-cell { min-height: 92px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; overflow: hidden; }
.cal-cell:hover { border-color: var(--accent); }
.cal-cell.other { opacity: .45; }
.cal-cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal-cell.sel { background: var(--accent-soft); }
.cal-cell .d { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.cal-cell.today .d { color: var(--accent); font-weight: 600; }
.cal-ev { font-size: 11px; line-height: 1.25; padding: 2px 5px; border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
.cal-ev.IV { background: var(--iv); } .cal-ev.DV { background: var(--dv); } .cal-ev.MED { background: var(--med); } .cal-ev.UMUM { background: var(--umum); }
.cal-ev.target { background: transparent; border: 1px dashed var(--line-strong); color: var(--ink); }
.cal-ev.log { background: var(--hijau-bg); color: var(--hijau); }
.cal-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
.cal-week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-week .col { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px; min-height: 160px; }
.cal-week .col.today { border-color: var(--accent); }
.cal-week .col .dh { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.cal-week .col .dh b { display: block; font-family: var(--mono); font-size: 16px; color: var(--ink); }
.cal-week .ev { font-size: 12px; padding: 4px 6px; border-radius: 6px; margin-bottom: 4px; border-left: 3px solid; background: var(--surface-2); }
.cal-week .ev.IV { border-color: var(--iv); } .cal-week .ev.DV { border-color: var(--dv); } .cal-week .ev.MED { border-color: var(--med); } .cal-week .ev.UMUM { border-color: var(--umum); }
@media (max-width: 860px) { .cal-cell { min-height: 64px; padding: 4px; } .cal-ev { display: none; } .cal-week { grid-template-columns: 1fr; } }
.dayview { margin-top: 12px; }
.hours { display: grid; grid-template-columns: 56px 1fr; }
.hours .h { font-family: var(--mono); font-size: 11.5px; color: var(--muted); padding: 6px 4px; border-top: 1px solid var(--line); }
.hours .slot { border-top: 1px solid var(--line); min-height: 34px; padding: 3px 4px; }
.hours .slot.now { background: var(--accent-soft); }

/* gantt */
#gantt { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-height: 420px; }
.vis-timeline { border: 0 !important; font-family: var(--sans); }
.vis-item { border-radius: 6px; border-width: 0 !important; color: #fff; font-size: 12.5px; }
.vis-item.vis-selected { box-shadow: 0 0 0 2px var(--accent); }
.vis-item.v-IV { background: var(--iv); } .vis-item.v-DV { background: var(--dv); } .vis-item.v-MED { background: var(--med); } .vis-item.v-UMUM { background: var(--umum); }
.vis-item.s-hijau { opacity: .55; }
.vis-item.vis-point.tgt { background: transparent; color: var(--ink); }
.vis-item.vis-point.tgt .vis-item-content { padding-left: 2px; }
.vis-item .vis-item-content { padding: 3px 8px; }
.vis-item.vis-range .vis-item-overflow { overflow: visible; }
.vis-labelset .vis-label { color: var(--ink); font-size: 12.5px; }
.vis-labelset .vis-label .vis-inner { padding: 6px 10px; }
.vis-time-axis .vis-text { color: var(--muted); font-size: 11.5px; }
.vis-time-axis .vis-text.vis-major { font-weight: 600; color: var(--ink); }
.vis-time-axis .vis-grid.vis-minor { border-color: var(--line); } .vis-time-axis .vis-grid.vis-major { border-color: var(--line-strong); }
.vis-panel.vis-center, .vis-panel.vis-left, .vis-panel.vis-right, .vis-panel.vis-top, .vis-panel.vis-bottom { border-color: var(--line); }
.vis-current-time { background: var(--merah); width: 2px; }
.vis-foreground .vis-group { border-color: var(--line); }
.vis-time-axis .vis-grid.vis-saturday, .vis-time-axis .vis-grid.vis-sunday { background: var(--surface-2); }
.vis-tooltip { background: var(--ink) !important; color: var(--bg) !important; border: 0 !important; border-radius: 6px !important; font-family: var(--sans) !important; font-size: 12.5px !important; padding: 6px 10px !important; }

/* weekly summary */
.summary p { margin-bottom: 8px; }
.summary ul { margin: 4px 0 10px 18px; padding: 0; }
.summary li { margin: 3px 0; }
.summary .warnbox { border-left: 3px solid var(--merah); padding-left: 12px; margin: 10px 0; }
.summary .okbox { border-left: 3px solid var(--hijau); padding-left: 12px; margin: 10px 0; }
.streak { display: flex; gap: 6px; }
.streak span { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; font-family: var(--mono); font-size: 11px; background: var(--surface-2); color: var(--muted); }
.streak span.y { background: var(--hijau); color: #fff; } .streak span.t { outline: 2px solid var(--accent); }

/* helpdesk */
.ai-out { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; line-height: 1.6; }
.ai-out h4 { margin: 12px 0 6px; font-size: 14.5px; font-family: var(--sans); }
.ai-out ul, .ai-out ol { margin: 4px 0 10px 20px; padding: 0; }
.ai-out table { border-collapse: collapse; width: 100%; font-size: 13.5px; margin: 8px 0; }
.ai-out th, .ai-out td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.ai-src { font-size: 12px; color: var(--muted); margin-top: 8px; }
.hist details { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; margin-bottom: 8px; background: var(--surface); }
.hist summary { cursor: pointer; font-size: 13.5px; }

/* settings */
.settings section { margin-bottom: 22px; }
.settings section h3 { margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.kv:last-child { border-bottom: 0; }
.switch { position: relative; width: 42px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch i { position: absolute; inset: 0; background: var(--surface-3); border-radius: 999px; transition: .15s; }
.switch i::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
.switch input:checked + i { background: var(--hijau); } .switch input:checked + i::before { transform: translateX(18px); }
.switch input:focus-visible + i { outline: 2px solid var(--accent); }
code { font-family: var(--mono); font-size: .9em; background: var(--code-bg); padding: 1px 5px; border-radius: 3px; }
pre { font-family: var(--mono); font-size: 12.5px; background: var(--code-bg); padding: 10px 12px; border-radius: 8px; overflow: auto; }
.steps { counter-reset: s; display: grid; gap: 8px; margin: 8px 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: 13.5px; }
.steps li::before { counter-increment: s; content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-family: var(--mono); font-size: 12px; }

/* widget mode */
body.widget { background: var(--surface); }
body.widget .shell { display: block; }
.wg { padding: 10px 12px 12px; font-size: 13px; }
.wg .wghead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.wg .wghead b { font-family: var(--serif); font-size: 15px; }

const FIREBASE_CONFIG = {"apiKey": "AIzaSyDuDUS6pVbVlTOY9Z2veIodiCxnL-8pOQc", "authDomain": "mykajian-ebe7e.firebaseapp.com", "projectId": "mykajian-ebe7e", "storageBucket": "mykajian-ebe7e.firebasestorage.app", "messagingSenderId": "351646083181", "appId": "1:351646083181:web:cbe520f6168564a6687764"};

const MONTHS = ['Januari','Februari','Mac','April','Mei','Jun','Julai','Ogos','September','Oktober','November','Disember'];
const MONTHS_S = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogo','Sep','Okt','Nov','Dis'];

const DAYS_S = ['Ahd','Isn','Sel','Rab','Kha','Jum','Sab'];

const DEFAULT_SETTINGS = {

/* ---------- utiliti ---------- */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = (n) => String(n).padStart(2, '0');
function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fromISO(s) { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function todayISO() { return toISO(new Date()); }
function addDays(iso, n) { const d = fromISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function diffDays(a, b) { return Math.round((fromISO(b) - fromISO(a)) / 86400000); } // b - a
function fmtDate(iso, long = false) { const d = fromISO(iso); if (!d) return ''; return long ? `${DAYS[d.getDay()]}, ${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}` : `${d.getDate()} ${MONTHS_S[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDateShort(iso) { const d = fromISO(iso); return d ? `${DAYS_S[d.getDay()]} ${d.getDate()} ${MONTHS_S[d.getMonth()]}` : ''; }
function fmtTime(d) { return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function nowHM() { return fmtTime(new Date()); }
function weekStart(iso) { const d = fromISO(iso); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow); return toISO(d); } // Isnin
function weekKey(iso) { return weekStart(iso); }
function monthStart(iso) { return iso.slice(0, 8) + '01'; }
function daysLabel(n) { if (n === 0) return 'hari ini'; if (n === 1) return 'esok'; if (n === -1) return 'semalam'; return n > 0 ? `${n} hari lagi` : `lewat ${-n} hari`; }
function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function isMobile() { return /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent); }
function toast(msg, ms = 2600) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg; $('#toasts').appendChild(el); setTimeout(() => el.remove(), ms); }

/* ---------- storan tempatan (pilihan peranti) ---------- */
const Local = {
  get(k, d) { try { const v = localStorage.getItem('mykajian.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mykajian.' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- status tugasan ---------- */
function latestLog(task, logs) {
  return logs.filter(l => l.taskId === task.id).sort((a, b) => (b.date + (b.createdAt || 0)).localeCompare(a.date + (a.createdAt || 0)))[0] || null;
}
function taskProgress(task, logs) { const l = latestLog(task, logs); return l ? Number(l.percent) || 0 : (Number(task.progress) || 0); }
function taskStatus(task, logs, today = todayISO()) {
  const pct = taskProgress(task, logs);
  if (pct >= 100) return 'hijau';
  const l = latestLog(task, logs);
  if (!l) return 'merah';
  if (task.due && task.due < today) return 'merah';
  if (diffDays(l.date, today) > 3) return 'merah';
  return 'kuning';
}
function taskVars(t) { const v = Array.isArray(t.variables) && t.variables.length ? t.variables.filter(x => VARS[x]) : (t.variable && VARS[t.variable] ? [t.variable] : ['UMUM']); return v.length ? v : ['UMUM']; }
function taskVar(t) { return taskVars(t)[0]; }
function guessBab(t) { const s = ((t.title || '') + ' ' + (t.description || '')).toLowerCase(); if (/instrumen|terjemah|pakar|soal selidik|rintis|sampel|kesahan|kebolehpercayaan|pls|sem/.test(s)) return 'Bab 3'; if (/dapatan|analisis data|keputusan/.test(s)) return 'Bab 4'; if (/perbincangan|implikasi|cadangan/.test(s)) return 'Bab 5'; if (/pengenalan|pernyataan masalah|objektif/.test(s)) return 'Bab 1'; return 'Bab 2'; }
function taskBab(t) { return BABS.includes(t.bab) ? t.bab : ''; }
function estimateHours(t) { if (Number(t.estHours) > 0) return Number(t.estHours); const s = ((t.title || '') + ' ' + (t.description || '')).toLowerCase(); if (/instrumen|terjemah|pakar|e-?mel/.test(s)) return 6; if (/icame|persidangan|conference/.test(s)) return 12; if (/kemas ?kini|semak semula|revis/.test(s)) return 20; if (/artikel|manuskrip|jurnal|ipg|bpg|mrj/.test(s)) return 40; if (/bab|tesis/.test(s)) return 60; return 12; }
function completedDate(t, logs) { const l = logs.filter(x => x.taskId === t.id && Number(x.percent) >= 100).sort((a, b) => a.date.localeCompare(b.date))[0]; return l ? l.date : null; }
function decorate(tasks, logs) {
  const today = todayISO();
  return tasks.filter(t => !t.archived).map(t => {
    const pct = taskProgress(t, logs), status = taskStatus(t, logs, today), vars = taskVars(t);
    return Object.assign({}, t, { pct, status, vars, variable: vars[0], bab: taskBab(t), est: estimateHours(t), daysToDue: t.due ? diffDays(today, t.due) : null, daysToTarget: t.target ? diffDays(today, t.target) : null, lastLog: latestLog(t, logs), doneDate: status === 'hijau' ? completedDate(t, logs) : null });
  });
}

/* ---------- Store: tempatan ---------- */
class LocalStore {
  constructor() { this.mode = 'local'; this.data = Local.get('data', null) || { tasks: [], logs: [], helpdesk: [], days: [], roadmap: {}, settings: {} }; this.data.days = this.data.days || []; this.data.roadmap = this.data.roadmap || {}; this.listeners = []; this.pending = 0; }
  async init() { return this; }
  snapshot() { return this.data; }
  onChange(fn) { this.listeners.push(fn); }
  _save() { Local.set('data', this.data); this.listeners.forEach(fn => fn(this.data)); }
  async upsertTask(t) { const i = this.data.tasks.findIndex(x => x.id === t.id); t.updatedAt = Date.now(); if (i >= 0) this.data.tasks[i] = t; else { t.createdAt = t.createdAt || Date.now(); this.data.tasks.push(t); } this._save(); }
  async deleteTask(id) { this.data.tasks = this.data.tasks.filter(t => t.id !== id); this.data.logs = this.data.logs.filter(l => l.taskId !== id); this._save(); }
  async upsertLog(l) { const i = this.data.logs.findIndex(x => x.id === l.id); l.updatedAt = Date.now(); if (i >= 0) this.data.logs[i] = l; else { l.createdAt = l.createdAt || Date.now(); this.data.logs.push(l); } this._save(); }
  async deleteLog(id) { this.data.logs = this.data.logs.filter(l => l.id !== id); this._save(); }
  async saveSettings(patch) { this.data.settings = Object.assign({}, this.data.settings, patch); this._save(); }
  async addHelpdesk(h) { this.data.helpdesk.unshift(h); this.data.helpdesk = this.data.helpdesk.slice(0, 60); this._save(); }
  async deleteHelpdesk(id) { this.data.helpdesk = this.data.helpdesk.filter(h => h.id !== id); this._save(); }
  async upsertDays(list) { for (const d of list) { const i = this.data.days.findIndex(x => x.date === d.date); d.updatedAt = Date.now(); if (i >= 0) this.data.days[i] = d; else this.data.days.push(d); } this._save(); }
  async deleteDay(date) { this.data.days = this.data.days.filter(d => d.date !== date); this._save(); }
  async saveRoadmap(patch) { this.data.roadmap = Object.assign({}, this.data.roadmap, patch); this._save(); }
  exportJSON() { return JSON.stringify(Object.assign({ exportedAt: new Date().toISOString(), app: 'MyKajian', version: APP_VERSION }, this.data), null, 2); }
  async importJSON(obj) { this.data = { tasks: obj.tasks || [], logs: obj.logs || [], helpdesk: obj.helpdesk || [], days: obj.days || [], roadmap: obj.roadmap || {}, settings: obj.settings || {} }; this._save(); }
}

/* ---------- Store: Firestore (awan, luar talian terbina dalam) ---------- */
class CloudStore {
  constructor(config) { this.mode = 'cloud'; this.config = config; this.data = { tasks: [], logs: [], helpdesk: [], days: [], roadmap: {}, settings: {} }; this.listeners = []; this.pending = 0; this.user = null; this.ready = false; this.serverReady = {}; this.unsubs = []; this.online = navigator.onLine; }
  async init() {
    const v = FIREBASE_VERSION, base = `https://www.gstatic.com/firebasejs/${v}/`;
    const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
    this.fb = { app, auth, fs };
    this.app = app.initializeApp(this.config);
    this.auth = auth.getAuth(this.app);
    try {
      this.db = fs.initializeFirestore(this.app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
    } catch (e) { this.db = fs.getFirestore(this.app); }
    await new Promise(res => { const un = auth.onAuthStateChanged(this.auth, u => { this.user = u; this._onAuth(); res(); }); this._unAuth = un; });
    window.addEventListener('online', () => { this.online = true; this._notify(); });
    window.addEventListener('offline', () => { this.online = false; this._notify(); });
    return this;
  }
  onChange(fn) { this.listeners.push(fn); }
  snapshot() { return this.data; }
  _notify() { this.listeners.forEach(fn => fn(this.data)); }
  _onAuth() {
    this.unsubs.forEach(u => u()); this.unsubs = []; this.serverReady = {};
    if (!this.user) { this.ready = false; this._notify(); return; }
    const { fs } = this.fb, u = this.user.uid, db = this.db;
    const sub = (name, key) => {
      const q = fs.collection(db, 'users', u, name);

/* ---------- Rumusan mingguan ---------- */

  const progressed = T.filter(t => !completed.includes(t) && logsW.some(l => l.taskId === t.id));
  const overdue = T.filter(t => t.status !== 'hijau' && t.due && t.due < today);
  const dueThisWeek = T.filter(t => t.status !== 'hijau' && t.due >= ws && t.due <= we);

async function saveWorkHour(day, idx, which, val) {
  const wh = JSON.parse(JSON.stringify(S.settings.workHours || DEFAULT_WORK_HOURS)); const r = wh[day] || []; while (r.length <= idx) r.push(['', '']); r[idx][which] = val;
  wh[day] = r.filter(x => x[0] && x[1] && hmToMin(x[1]) > hmToMin(x[0])).sort((a, b) => a[0].localeCompare(b[0]));
  await S.store.saveSettings({ workHours: wh }); Scheduler.markStale(); toast('Waktu kerja disimpan; jana semula jadual untuk menerapkannya');
}
async function saveSetting(k, v) { await S.store.saveSettings({ [k]: v }); if (S.store.mode === 'local') { /* applyData dipanggil melalui listener */ } toast('Tetapan disimpan'); }
async function importFile(inp) { const f = inp.files[0]; if (!f) return; try { const obj = JSON.parse(await f.text()); if (!obj.tasks) throw new Error('bukan fail MyKajian'); if (confirm(`Import ${obj.tasks.length} tugasan dan ${(obj.logs || []).length} log? Data dengan ID sama akan ditulis ganti.`)) { await S.store.importJSON(obj); toast('Data diimport'); } } catch (e) { alert('Fail tidak sah: ' + e.message); } }
async function seedNow() { for (const t of seedTasks()) if (!S.tasks.some(x => x.title === t.title)) await S.store.upsertTask(t); await S.store.saveSettings({ seeded: true }); toast('Tugasan awal dimuatkan'); }

async function saveTask(e, id) {
  e.preventDefault(); const f = new FormData(e.target), o = Object.fromEntries(f.entries()); const variables = f.getAll('variables');
  if (o.due < o.start) { alert('Dateline tidak boleh lebih awal daripada tarikh mula.'); return; }
  if (!variables.length) { alert('Pilih sekurang-kurangnya satu pembolehubah kajian.'); return; }
  if (!BABS.includes(o.bab)) { alert('Pilih Bab untuk tugasan ini.'); return; }
  const old = id ? S.tasks.find(x => x.id === id) : null;
  const t = Object.assign({}, old || { id: uid(), progress: 0, archived: false }, { title: o.title.trim(), description: o.description.trim(), variable: variables[0], variables, bab: o.bab, estHours: Number(o.estHours) > 0 ? Number(o.estHours) : 0, start: o.start, due: o.due, target: o.target || '', startTime: o.startTime || '', endTime: o.endTime || '' });
  await S.store.upsertTask(t); closeModal(); toast(old ? 'Tugasan dikemas kini' : 'Tugasan ditambah'); Scheduler.markStale();
}

  const sel = l ? l.taskId : (taskId || (active[0] && active[0].id) || '');
  const cur = S.tasksD.find(t => t.id === sel); const pct = l ? l.percent : (cur ? cur.pct : 0);
  if (!S.tasks.length) { alert('Tambah tugasan dahulu sebelum mengisi log.'); return; }
  modal(`<header><h2>${l ? 'Sunting log' : 'Log progress harian'}</h2><button class="btn sm ghost" onclick="closeModal()">✕</button></header>
  <form class="form" onsubmit="saveLog(event,'${l ? l.id : ''}')">
    <div class="row2"><div class="field"><label>Tarikh (Date)</label><input type="date" name="date" value="${l ? l.date : (date || todayISO())}" required></div>
    <div class="field"><label>Tugasan</label><select name="taskId" onchange="const t=S.tasksD.find(x=>x.id===this.value);if(t){document.getElementById('lp').value=t.pct;document.getElementById('lpv').textContent=t.pct+'%'}">${S.tasksD.map(t => `<option value="${t.id}" ${t.id === sel ? 'selected' : ''}>${t.bab || ''} · ${t.vars.map(v => VARS[v].short).join('+')} · ${esc(t.title)}</option>`).join('')}</select></div></div>
    <div class="field"><label>Apa yang disiapkan hari ini (Long Text)</label><textarea name="done" required placeholder="Contoh: Siapkan surat iringan dan borang penilaian; e-mel kepada dua pakar pertama.">${esc(l ? l.done : '')}</textarea></div>
    <div class="field"><label>Halangan (Long Text, pilihan)</label><textarea name="blockers" style="min-height:56px" placeholder="Apa yang menghalang kemajuan?">${esc(l ? l.blockers || '' : '')}</textarea></div>
    <div class="field"><label>Peratus siap keseluruhan tugasan</label><div class="range"><input type="range" id="lp" name="percent" min="0" max="100" step="5" value="${pct}" oninput="document.getElementById('lpv').textContent=this.value+'%'"><div class="pctbox" id="lpv">${pct}%</div></div><div class="hint">100% menukar status kepada Hijau. Nyatakan target siap dalam borang tugasan.</div></div>
    <div class="field"><label>Rancangan esok (Long Text, pilihan)</label><textarea name="plan" style="min-height:56px" placeholder="Dibacakan dalam taklimat pagi esok.">${esc(l ? l.plan || '' : '')}</textarea></div>
    <footer>${l ? `<button type="button" class="btn danger" onclick="if(confirm('Padam log ini?')){S.store.deleteLog('${l.id}');closeModal()}">Padam</button>` : '<span></span>'}<div class="r"><button type="button" class="btn" onclick="closeModal()">Batal</button><button class="btn primary">Simpan log</button></div></footer>
  </form>`);
}
async function saveLog(e, id) {
  e.preventDefault(); const o = Object.fromEntries(new FormData(e.target).entries());
  const old = id ? S.logs.find(x => x.id === id) : null;
  const l = Object.assign({}, old || { id: uid() }, { date: o.date, taskId: o.taskId, done: o.done.trim(), blockers: (o.blockers || '').trim(), percent: clamp(Number(o.percent) || 0, 0, 100), plan: (o.plan || '').trim() });
  await S.store.upsertLog(l);
  const t = S.tasks.find(x => x.id === l.taskId); if (t) { t.progress = l.percent; await S.store.upsertTask(t); }
  closeModal(); toast(l.percent >= 100 ? 'Tahniah, tugasan selesai (Hijau). Disimpan dalam Arkib.' : 'Log disimpan'); Reminder.check(); Scheduler.markStale();
}

/* ---------- Log masuk awan ---------- */
function openAuth() {
  modal(`<header><h2>Log masuk storan awan</h2><button class="btn sm ghost" onclick="closeModal()">✕</button></header>
  <form class="form" onsubmit="doAuth(event)"><div class="field"><label>E-mel</label><input type="email" name="email" required value="${esc(Local.get('lastEmail', ''))}"></div><div class="field"><label>Kata laluan</label><input type="password" name="pass" required minlength="6"></div>
  <p class="hint">Gunakan e-mel dan kata laluan yang sama pada setiap peranti. Kali pertama: pilih "Cipta akaun".</p>
  <footer><button type="button" class="btn" onclick="doAuth(null,true)">Cipta akaun</button><div class="r"><button type="button" class="btn" onclick="S.store.signInGoogle().catch(e=>alert(e.message))">Google</button><button class="btn primary">Log masuk</button></div></footer></form>`);
}
async function doAuth(e, create) { if (e) e.preventDefault(); const f = $('.modal form'); const email = f.email.value.trim(), pass = f.pass.value; if (!email || pass.length < 6) { alert('Isi e-mel dan kata laluan (sekurang-kurangnya 6 aksara).'); return; } Local.set('lastEmail', email);
  try { if (create) await S.store.createEmail(email, pass); else await S.store.signInEmail(email, pass); closeModal(); toast('Log masuk berjaya'); } catch (err) { alert('Gagal: ' + (err.code || err.message)); } }
async function connectCloud() {
  let txt = $('#fbcfg').value.trim(); if (!txt) return alert('Tampal konfigurasi Firebase dahulu.');
  try { const m = txt.match(/\{[\s\S]*\}/); txt = m ? m[0] : txt; const cfg = Function('"use strict";return (' + txt + ')')(); if (!cfg.apiKey || !cfg.projectId) throw new Error('apiKey atau projectId tiada');
    Local.set('firebaseConfig', cfg); toast('Menyambung ke awan…'); location.reload(); } catch (e) { alert('Konfigurasi tidak sah: ' + e.message); }
}
function disconnectCloud() { if (!confirm('Putuskan sambungan awan pada peranti ini? Data awan kekal; peranti ini kembali ke mod tempatan.')) return; Local.set('firebaseConfig', null); location.reload(); }
async function migrateLocalToCloud() {
  const local = Local.get('data', null); if (!local || !(local.tasks || []).length) return alert('Tiada data tempatan untuk dipindahkan.');
  if (!confirm(`Pindahkan ${local.tasks.length} tugasan dan ${(local.logs || []).length} log dari peranti ini ke awan?`)) return;
  await S.store.importJSON(local); toast('Data dipindahkan ke awan');
}
</script>
<script>
/* =====================================================================
   Bahagian 3: suara, loceng, notifikasi, penjadual peringatan, widget,
   Helpdesk AI, PWA dan permulaan
   ===================================================================== */

/* ---------- Suara (Web Speech API) ---------- */
const Speech = {
  _voices: [],
  init() { const load = () => { this._voices = (window.speechSynthesis ? speechSynthesis.getVoices() : []).slice().sort((a, b) => (/^ms/i.test(b.lang) - /^ms/i.test(a.lang)) || a.name.localeCompare(b.name)); }; load(); if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { load(); if (S.view === 'tetapan') render(); }; },
  voices() { return this._voices; },
  pick() { const s = S.settings; if (s.voiceURI) { const v = this._voices.find(v => v.voiceURI === s.voiceURI); if (v) return v; }
    return this._voices.find(v => /^ms[-_]MY/i.test(v.lang) && /online|natural|neural/i.test(v.name)) || this._voices.find(v => /^ms/i.test(v.lang)) || this._voices.find(v => /^id/i.test(v.lang)) || this._voices.find(v => /^en/i.test(v.lang)) || this._voices[0] || null; },
  say(text, opts = {}) {
    if (!window.speechSynthesis) { toast('Pelayar ini tidak menyokong suara.'); return; }
    try { speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(text); const v = this.pick(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'ms-MY';
    u.rate = (Number(S.settings.voiceRate) || 1) * (opts.stern ? 1.08 : 1); u.pitch = opts.stern ? 0.75 : 1; u.volume = 1;
    if (opts.onend) u.onend = opts.onend;
    speechSynthesis.speak(u); Notify.show('MyKajian', text.slice(0, 180));
  },
  briefText() {
    const today = todayISO(), T = S.tasksD.filter(t => t.status !== 'hijau'), s = S.settings;
    const dueToday = T.filter(t => t.due === today), tgtToday = T.filter(t => t.target === today && t.due !== today);
    const overdue = T.filter(t => t.daysToDue != null && t.daysToDue < 0);
    const week = T.filter(t => t.due > today && t.due <= addDays(weekStart(today), 6));
    const month = T.filter(t => t.due > addDays(weekStart(today), 6) && t.due.slice(0, 7) === today.slice(0, 7));
    const nearest = T.filter(t => t.daysToDue != null && t.daysToDue >= 0).sort((a, b) => a.due.localeCompare(b.due))[0];
    const logsToday = S.logs.filter(l => l.date === today);
    const yesterdayPlan = S.logs.filter(l => l.date === addDays(today, -1) && l.plan).map(l => l.plan).join('. ');
    const names = arr => arr.slice(0, 3).map(t => t.title).join('; ') + (arr.length > 3 ? `; dan ${arr.length - 3} lagi` : '');
    let s1 = `${greeting()} ${s.userTitle}. Hari ini ${fmtDate(today, true)}. `;
    if (dueToday.length) s1 += `Dateline hari ini: ${names(dueToday)}. `;
    if (tgtToday.length) s1 += `Target siap hari ini: ${names(tgtToday)}. `;
    if (overdue.length) s1 += `Amaran, ${overdue.length} tugasan melepasi dateline: ${names(overdue)}. `;
    if (!dueToday.length && !tgtToday.length && nearest) s1 += `Dateline terdekat: ${nearest.title}, ${daysLabel(nearest.daysToDue)}. `;
    if (yesterdayPlan) s1 += `Rancangan yang anda tulis semalam: ${yesterdayPlan}. `;
    s1 += week.length ? `Minggu ini: ${week.length} dateline lagi, iaitu ${names(week)}. ` : 'Tiada dateline lain minggu ini. ';
    s1 += month.length ? `Bulan ini: ${month.length} dateline lagi. ` : '';
    const w = currentWeekPlan(today); if (w) s1 += `Fokus minggu ${w.week}: ${w.task}. `;
    const dd = dayDoc(today); if (dd && dd.goal && dd.goal !== '-') s1 += `Hasil yang mesti ada hari ini: ${dd.goal}. `;
    const cd = countdownText(4); if (cd) s1 += `Kiraan detik tonggak: ${cd} `;
    s1 += logsToday.length ? 'Log hari ini sudah diisi, terima kasih.' : `Jangan lupa isi log progress sebelum ${s.logDeadline.replace(':', ' ')}.`;
    return s1;
  },
  dailyBrief(force) { const t = this.briefText(); this.say(t); Local.set('lastSpokenAt', Date.now()); if (!force) Local.set('lastBriefDate', todayISO()); }
};

/* ---------- Loceng (Web Audio) ---------- */
const Bell = {
  ctx: null,
  unlock() { try { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch (e) {} },
  bell(times = 3) { this.unlock(); if (!this.ctx) return; const c = this.ctx, t0 = c.currentTime;
    for (let i = 0; i < times; i++) { const t = t0 + i * 0.55; [880, 1320, 1760].forEach((f, k) => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35 / (k + 1), t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5); o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.55); }); } }
};
Bell.buzzer = function (times = 4) { this.unlock(); if (!this.ctx) return; const c = this.ctx, t0 = c.currentTime; for (let i = 0; i < times; i++) { const t = t0 + i * 0.45; const o = c.createOscillator(), g = c.createGain(); o.type = 'sawtooth'; o.frequency.setValueAtTime(180, t); o.frequency.linearRampToValueAtTime(140, t + 0.35); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.02); g.gain.setValueAtTime(0.6, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.4); o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.42); } };
Bell.chime = function () { this.unlock(); if (!this.ctx) return; const c = this.ctx, t0 = c.currentTime; [523, 659, 784].forEach((f, i) => { const t = t0 + i * 0.18; const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); o.connect(g).connect(c.destination); o.start(t); o.stop(t + 0.65); }); };
document.addEventListener('pointerdown', () => Bell.unlock(), { once: true, capture: true });
document.addEventListener('keydown', () => Bell.unlock(), { once: true, capture: true });

/* ---------- Notifikasi sistem ---------- */
const Notify = {
  async request() { if (!('Notification' in window)) return toast('Pelayar ini tidak menyokong notifikasi.'); const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Notifikasi dibenarkan' : 'Notifikasi tidak dibenarkan'); },
  ok() { return S.settings.notifications && 'Notification' in window && Notification.permission === 'granted'; },
  async show(title, body, opts = {}) { if (!this.ok()) return; try { const reg = await (navigator.serviceWorker && navigator.serviceWorker.getRegistration()); if (reg) reg.showNotification(title, Object.assign({ body, icon: 'icon-192.png', badge: 'icon-192.png', tag: opts.tag || 'mykajian-' + Date.now(), silent: !!opts.silent, requireInteraction: !!opts.sticky }, opts)); else new Notification(title, { body, icon: 'icon-192.png' }); } catch (e) {} },
  weeklyPersistent: debounce(function () { if (!S.settings.weeklyNotification || !Notify.ok()) return; const today = todayISO(), we = addDays(weekStart(today), 6);
    const T = S.tasksD.filter(t => t.status !== 'hijau' && t.due && t.due <= we).sort((a, b) => a.due.localeCompare(b.due)).slice(0, 6);
    const body = T.length ? T.map(t => `${fmtDateShort(t.due)} · ${t.title.slice(0, 40)} (${t.pct}%)`).join('\n') : 'Tiada dateline minggu ini.';
    Notify.show('MyKajian · minggu ini', body, { tag: 'mykajian-weekly', silent: true, sticky: true, renotify: false }); }, 1500)
};

/* ---------- Penjadual jam (v2.0): waktu kerja, Pomodoro, keutamaan dateline ---------- */
const Scheduler = {
  _stale: false, _busy: false,
  rangesFor(date) { const wh = S.settings.workHours || DEFAULT_WORK_HOURS; const d = fromISO(date); const r = wh[d.getDay()] || wh[String(d.getDay())] || []; return r.filter(x => x && x[0] && x[1] && hmToMin(x[1]) > hmToMin(x[0])).slice().sort((a, b) => a[0].localeCompare(b[0])); },
  slotsFor(date) {
    const work = Math.max(15, Number(S.settings.pomodoroWork) || 30), brk = Math.max(0, Number(S.settings.pomodoroBreak) || 0); const out = [];
    this.rangesFor(date).forEach(([a, b]) => { let t = hmToMin(a); const end = hmToMin(b); while (end - t >= 15) { const len = Math.min(work, end - t); out.push({ start: minToHM(t), end: minToHM(t + len), min: len }); t += len + brk; } });
    return out;
  },
  workMinutesBetween(from, to) { let m = 0; for (let d = from; d <= to; d = addDays(d, 1)) m += this.slotsFor(d).reduce((a, s) => a + s.min, 0); return m; },
  remainingMin(t) { return Math.max(0, Math.round(estimateHours(t) * 60 * (100 - t.pct) / 100)); },
  shortfalls() {
    const today = todayISO(); const out = [];
    S.tasksD.filter(t => t.status !== 'hijau' && t.due).forEach(t => { const need = this.remainingMin(t); if (!need) return; const cap = t.due < today ? 0 : this.workMinutesBetween(today, t.due); const others = S.tasksD.filter(x => x.status !== 'hijau' && x.id !== t.id && x.due && x.due <= t.due).reduce((a, x) => a + this.remainingMin(x), 0); if (need + others > cap) out.push({ title: t.title, due: t.due, hours: Math.max(1, Math.ceil((need + others - cap) / 60)) }); });
    return out.slice(0, 3);
  },
  generate(fromDate, horizonDays) {
    const today = todayISO(), nowM = hmToMin(nowHM()); const horizon = Math.max(7, horizonDays || S.settings.horizonDays || 60);
    const tasks = S.tasksD.filter(t => t.status !== 'hijau').map(t => ({ id: t.id, due: t.due || addDays(today, horizon), remain: this.remainingMin(t) }));
    // tolak blok manual pada masa hadapan yang sudah diperuntukkan
    S.days.filter(d => d.date >= fromDate).forEach(d => d.blocks.forEach(b => { if (b.manual && b.taskId) { const t = tasks.find(x => x.id === b.taskId); if (t) t.remain = Math.max(0, t.remain - (hmToMin(b.end) - hmToMin(b.start))); } }));
    const days = [];
    for (let i = 0; i < horizon; i++) {
      const date = addDays(fromDate, i); const existing = dayDoc(date); const manual = existing ? existing.blocks.filter(b => b.manual || (date === today && b.end <= nowHM()) || date < today) : [];
      const keep = manual.slice(); const free = this.slotsFor(date).filter(s => !(date === today && hmToMin(s.end) <= nowM)).filter(s => !keep.some(k => hmToMin(k.start) < hmToMin(s.end) && hmToMin(s.start) < hmToMin(k.end)));
      free.forEach(s => {
        const cands = tasks.filter(t => t.remain > 0);
        let pick = null;
        if (cands.length) { cands.forEach(t => { const daysLeft = Math.max(0.5, diffDays(date, t.due)); t.score = t.due < date ? 1e9 + t.remain : t.remain / daysLeft; }); cands.sort((a, b) => b.score - a.score || a.due.localeCompare(b.due)); pick = cands[0]; }
        keep.push({ id: uid(), start: s.start, end: s.end, taskId: pick ? pick.id : null, manual: false, done: false, note: '' });
        if (pick) pick.remain = Math.max(0, pick.remain - s.min);
      });
      keep.sort((a, b) => a.start.localeCompare(b.start));
      const doc = { id: date, date, blocks: keep, generatedAt: Date.now() };
      const same = existing && JSON.stringify(existing.blocks.map(b => [b.start, b.end, b.taskId, b.manual, b.done])) === JSON.stringify(keep.map(b => [b.start, b.end, b.taskId, b.manual, b.done]));
      if (!same) days.push(doc);
    }
    return days;
  },
  async regenerate(silent) {
    if (this._busy) return; this._busy = true;
    try { const days = this.generate(todayISO(), S.settings.horizonDays); if (days.length) await S.store.upsertDays(days); this._stale = false; Local.set('lastScheduleGen', Date.now()); if (!silent) toast(`Jadual dijana: ${days.length} hari dikemas kini`); if (!silent) render(); }
    catch (e) { console.error(e); if (!silent) toast('Gagal menjana jadual: ' + e.message); }
    finally { this._busy = false; }
  },
  markStale() { this._stale = true; if (S.settings.autoSchedule) { clearTimeout(this._t); this._t = setTimeout(() => this.regenerate(true).then(() => render()), 1500); } },
  isStale() { return this._stale || !dayDoc(todayISO()) && this.rangesFor(todayISO()).length > 0 && S.tasksD.some(t => t.status !== 'hijau'); },
  autoEnsure() {
    if (!S.settings.autoSchedule || !S.tasks.length) return; const st = S.store; if (st.mode === 'cloud' && !(st.user && st.serverReady.days && st.serverReady.tasks)) return;
    const today = todayISO(); const last = Local.get('lastScheduleGen', 0); const has = !!dayDoc(today) || !this.rangesFor(today).length;
    if (!has || Date.now() - last > 6 * 3600 * 1000) { if (!this._auto) { this._auto = true; setTimeout(() => this.regenerate(true).then(() => { this._auto = false; render(); }), 800); } }
  },
  async saveBlock(date, block) { const d = dayDoc(date) || { id: date, date, blocks: [] }; const blocks = d.blocks.filter(b => b.id !== block.id); blocks.push(block); blocks.sort((a, b) => a.start.localeCompare(b.start)); await S.store.upsertDays([Object.assign({}, d, { blocks })]); },
  async deleteBlock(date, id) { const d = dayDoc(date); if (!d) return; await S.store.upsertDays([Object.assign({}, d, { blocks: d.blocks.filter(b => b.id !== id) })]); },
  alarmTimes(date) { const out = new Set(); this.rangesFor(date).forEach(([a, b]) => { for (let t = hmToMin(a); t < hmToMin(b); t += 60) out.add(minToHM(t)); });
    if (S.settings.alarmMode === 'hourly') { const a = hmToMin(S.settings.activeStart || '08:00'), b = hmToMin(S.settings.activeEnd || '22:00'); for (let t = Math.ceil(a / 60) * 60; t <= b; t += 60) out.add(minToHM(t)); }
    return [...out].sort(); }
};

/* ---------- Penjadual peringatan ---------- */
const Reminder = {
  timer: null, alarmTimer: null,
  start() { this.check(); this.timer = setInterval(() => this.check(), 30000); document.addEventListener('visibilitychange', () => { if (!document.hidden) this.check(); }); },
  inActive() { const n = nowHM(), s = S.settings; return n >= s.activeStart && n <= s.activeEnd; },
  check() {
    const s = S.settings, today = todayISO(), now = Date.now();
    // taklimat pagi sekali sehari
    if (s.morningBrief && this.inActive() && Local.get('lastBriefDate', '') !== today && S.tasks.length) { Speech.dailyBrief(false); }
    // peringatan berulang mengikut selang (di luar slot kerja apabila alarm tegas aktif)
    else if (s.reminderInterval > 0 && this.inActive() && now - Local.get('lastSpokenAt', 0) >= s.reminderInterval * 60000 && S.tasks.length && !(s.sternAlarm && this.inWorkRange())) { Speech.dailyBrief(false); }
    this.checkStern(); this.checkPomodoro();
    // loceng log harian
    const hasLog = S.logs.some(l => l.date === today);
    const due = nowHM() >= s.logDeadline && !hasLog && s.bell && S.tasks.length && now >= (S.alarm.snoozedUntil || 0);
    if (due && !S.alarm.active) this.startAlarm(); else if (!due && S.alarm.active) this.stopAlarm();
    // rumusan mingguan Ahad malam
    const d = new Date(); if (d.getDay() === 0 && d.getHours() >= 20 && Local.get('lastWeeklyShown', '') !== weekStart(today) && S.tasks.length) { Local.set('lastWeeklyShown', weekStart(today)); location.hash = '#/mingguan'; Speech.say('Ini rumusan mingguan anda. ' + weeklySpeech(weekStart(today))); }
  },
  inWorkRange() { const hm = nowHM(); return Scheduler.rangesFor(todayISO()).some(([a, b]) => a <= hm && hm < b); },
  checkStern() {
    const s = S.settings; if (!s.sternAlarm || !S.tasks.length) return; const today = todayISO(), hm = nowHM(); const key = today + ' ' + hm;
    if (!Scheduler.alarmTimes(today).includes(hm) || Local.get('lastStern', '') === key) return;
    Local.set('lastStern', key); this.sternNow(false);
  },
  sternText() {
    const today = todayISO(), hm = nowHM(), s = S.settings; const cur = currentBlock(today, hm), nxt = nextBlock(today, hm);
    let msg = `${s.userTitle}! Sekarang pukul ${fmtHM12(hm)}. `;
    if (cur && cur.taskId && taskOf(cur.taskId)) { const t = taskOf(cur.taskId); msg += `Anda sepatutnya sedang membuat: ${t.title}. Kemajuan baru ${t.pct} peratus. Dateline ${daysLabel(t.daysToDue)}. `; if (cur.note) msg += `Nota: ${cur.note}. `; msg += t.daysToDue != null && t.daysToDue <= 2 ? 'Ini sudah kritikal. Tutup semua gangguan dan siapkan sekarang.' : 'Jangan tangguh. Tiga puluh minit fokus penuh, kemudian rehat lima minit.'; }
    else if (cur) msg += 'Blok ini bebas. Gunakan untuk semakan atau susulan e-mel, jangan biarkan kosong.';
    else if (nxt) msg += `Tiada blok sekarang. Blok seterusnya ${nxt.date === today ? '' : fmtDateShort(nxt.date) + ' '}pukul ${fmtHM12(nxt.block.start)}: ${blockLabel(nxt.block)}. Bersedia.`;
    else msg += 'Tiada jadual dijana. Buka MyKajian dan tekan Jana semula jadual sekarang.';
    const cd = countdownText(3); if (cd) msg += ` Kiraan detik: ${cd}`;
    const dd = dayDoc(today); if (dd && dd.goal && dd.goal !== '-' && (!cur || Local.get('goalSpoken', '') !== today)) { msg += ` Hasil yang mesti ada hari ini: ${dd.goal}.`; Local.set('goalSpoken', today); }
    return msg;
  },

    // pertindihan

    const prio = T.slice().sort((a, b) => (a.daysLeft - b.daysLeft) || (a.pct - b.pct));
    md += `\n### 3. Hari ini\n`; blocks.forEach((b, i) => { const t = prio[i % Math.max(1, Math.min(prio.length, 2))]; if (t) md += `- ${b}: **${t.title}** (${this.nextStep(t)})\n`; });

    // bulan ini
    md += `\n### 5. Pencapaian bulan ini\n`; T.filter(t => t.due && t.due.slice(0, 7) === today.slice(0, 7)).forEach(t => md += `- ${fmtDateShort(t.due)}: ${t.title} (${t.pct}% siap; target ${t.target ? fmtDateShort(t.target) : 'tiada'})\n`);

  Speech.init(); PWA.init();
  const cfg = /[?&]local=1/.test(location.search) ? null : (FIREBASE_CONFIG || Local.get('firebaseConfig', null));
  if (cfg) { try { S.store = await Promise.race([new CloudStore(cfg).init(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 20000))]); } catch (e) { console.error(e); toast('Awan tidak dapat dimuatkan (' + e.message + '); mod tempatan digunakan buat sementara. Muat semula halaman untuk cuba lagi.', 6000); S.store = await new LocalStore().init(); } }
  else S.store = await new LocalStore().init();
  S.store.onChange(applyData);
  const d = S.store.snapshot();
  if (S.store.mode === 'local' && !(d.settings || {}).seeded && !(d.tasks || []).length) { for (const t of seedTasks()) await S.store.upsertTask(t); await S.store.saveSettings({ seeded: true, reminderInterval: 60, activeStart: '08:00', activeEnd: '22:00', logDeadline: '21:00' }); }
  applyData(S.store.snapshot());
  $('#btnListen').onclick = () => Speech.dailyBrief(true); $('#btnWidget').onclick = openWidget;
  const isWidget = location.hash.includes('widget');
  route();
  if (!isWidget) Reminder.start();
  window.addEventListener('storage', e => { if (e.key === 'mykajian.data' && S.store.mode === 'local') { S.store.data = Local.get('data', S.store.data); applyData(S.store.data); } });
  if (S.store.mode === 'cloud' && !S.store.user && !isWidget) setTimeout(openAuth, 400);
}
boot();
</script>
</body>
